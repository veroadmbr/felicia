<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Felícia · Acesso</title>
<link rel="icon" href="login-assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap">
<style>html{color-scheme:light}body{margin:0;background:#D8131D}[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:100;background:#D8131D;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gate form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center;color:#FAF5E6;font-family:"Outfit","Helvetica Neue",Arial,sans-serif}
.gate img{width:min(260px,70%);margin:0 auto 18px}
.gate label{font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase}
.gate input{font:inherit;font-size:17px;text-align:center;color:#161312;background:#FAF5E6;border:0;border-radius:999px;padding:14px 20px;letter-spacing:.12em}
.gate input:focus-visible{outline:3px solid #161312;outline-offset:2px}
.gate button{font:inherit;font-size:16px;font-weight:600;color:#D8131D;background:#FAF5E6;border:2px solid #FAF5E6;border-radius:999px;padding:13px 20px;cursor:pointer}
.gate button:hover{background:transparent;color:#FAF5E6}
.gate .err{font-size:14px;background:rgba(0,0,0,.18);border-radius:10px;padding:8px 12px}
.gate .small{font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:.8;margin-top:12px}
</style>
</head>
<body>
<div class="gate">
  <form id="f">
    <img src="login-assets/logo.png" alt="Felícia pizzabar">
    <label for="pw">Senha de acesso</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button type="submit" id="go">Entrar</button>
    <p class="err" id="err" hidden>Senha incorreta. Confira e tente de novo.</p>
    <p class="small">Material confidencial</p>
  </form>
</div>
<script>
const f=document.getElementById("f"),err=document.getElementById("err"),btn=document.getElementById("go");
f.addEventListener("submit",async e=>{e.preventDefault();err.hidden=true;btn.disabled=true;btn.textContent="Entrando…";
  try{const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:document.getElementById("pw").value})});
    if(r.ok){const next=new URLSearchParams(location.search).get("next")||"/";location.href=(next.startsWith("/")?next:"/")+location.hash;return}
    err.textContent="Senha incorreta. Confira e tente de novo.";err.hidden=false}
  catch(x){err.textContent="Não foi possível conectar. Tente de novo.";err.hidden=false}
  btn.disabled=false;btn.textContent="Entrar"});
</script>
</body>
</html>
